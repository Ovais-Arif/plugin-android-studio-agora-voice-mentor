name: Unpack project
on:
  push:
    paths: ['project.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive
        run: |
          unzip -o project.zip -d .
          git rm -q --cached project.zip
          rm project.zip
          git config user.name "Ovais Godil"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          git commit -m "Add project source code"
          git push
